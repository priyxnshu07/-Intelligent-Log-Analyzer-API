<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Analyzer Dashboard</title>
    <style>
        :root {
            --primary: #ccff00;
            --bg: #0a0a0a;
            --card: #1a1a1a;
            --text: #ffffff;
            --muted: #888;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { color: var(--primary); margin: 0; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
        }
        .stat-card h2 { margin: 10px 0; font-size: 2rem; }
        .stat-card p { color: var(--muted); margin: 0; text-transform: uppercase; font-size: 0.8rem; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background: var(--primary);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        button.secondary { background: #333; color: white; }

        .log-table-container {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid #333;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            background: #252525;
            padding: 15px;
            color: var(--muted);
            font-size: 0.9rem;
        }
        td {
            padding: 15px;
            border-top: 1px solid #333;
            font-size: 0.9rem;
        }
        .level {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .level-info { background: #007bff; color: white; }
        .level-error { background: #ff4444; color: white; }
        .level-warning { background: #ffbb33; color: black; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>LOG ANALYZER DASHBOARD</h1>
            <div id="status" style="color: var(--primary)">● Connected to Gym Project</div>
        </header>

        <div class="stats-grid" id="summary-cards">
            <!-- Stats will be loaded here -->
        </div>

        <div class="controls">
            <button onclick="fetchLogs()">Refresh Logs</button>
            <button class="secondary" onclick="window.open('/docs', '_blank')">API Docs</button>
        </div>

        <div class="log-table-container">
            <table>
                <thead>
                    <tr>
                        <th>TIMESTAMP</th>
                        <th>LEVEL</th>
                        <th>MESSAGE</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <!-- Logs will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchSummary() {
            const res = await fetch('/summary/');
            const data = await res.json();
            const container = document.getElementById('summary-cards');
            container.innerHTML = '';
            
            for (const [level, count] of Object.entries(data)) {
                container.innerHTML += `
                    <div class="stat-card">
                        <p>${level}</p>
                        <h2>${count}</h2>
                    </div>
                `;
            }
        }

        async function fetchLogs() {
            const res = await fetch('/query/?limit=20');
            const logs = await res.json();
            const body = document.getElementById('log-body');
            body.innerHTML = '';
            
            logs.reverse().forEach(log => {
                const time = new Date(log.timestamp).toLocaleTimeString();
                body.innerHTML += `
                    <tr>
                        <td style="color: var(--muted)">${time}</td>
                        <td><span class="level level-${log.level}">${log.level}</span></td>
                        <td>${log.message}</td>
                    </tr>
                `;
            });
            fetchSummary();
        }

        // Auto refresh every 5 seconds
        setInterval(fetchLogs, 5000);
        fetchLogs();
    </script>
</body>
</html>
