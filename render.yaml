# Render Blueprint: one free, stateless web service.
# No database, no Redis, no disk, no secrets.
services:
  - type: web
    name: universal-log-doctor
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      # Render's proxy sets X-Forwarded-For, which tells visitors apart for rate limits.
      - key: LOGDOCTOR_TRUST_PROXY
        value: "true"
