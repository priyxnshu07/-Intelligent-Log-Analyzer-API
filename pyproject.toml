[project]
name = "logdoctor"
version = "0.1.0"
description = "Group and explain the errors in a log file. Runs locally."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logdoctor = "logdoctor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["logdoctor"]
